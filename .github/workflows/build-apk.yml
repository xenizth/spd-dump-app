name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate sdkmanager
        id: sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)
          echo "Found: $SDKMANAGER"
          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept SDK licenses
        run: yes | "${{ steps.sdk.outputs.path }}" --licenses || true

      - name: Install platform, build-tools, NDK, CMake
        run: |
          "${{ steps.sdk.outputs.path }}" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spd-dump-app-debug
          path: app/build/outputs/apk/debug/*.apk
